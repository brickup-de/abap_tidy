baseURL       = "https://localhost:1313/"
locale        = "en-us"
title         = "Clean ABAP"
enableGitInfo = true

[[cascade]]
type = "docs"
[cascade.params]
license_name = "CC BY 3.0"
license_url  = "https://creativecommons.org/licenses/by/3.0/"
source_name  = "SAP/styleguides"

[frontmatter]
lastmod = [":git", "lastmod", ":fileModTime"]

[markup.goldmark.renderer]
unsafe = true # Allow HTML in markdown

[markup.highlight]
noClasses = false

[[menu.main]]
name   = "Search"
weight = 1
[menu.main.params]
type = "search"

[[menu.main]]
name        = "GitHub"
url         = "https://github.com/brickup-de/abap_tidy"
weight      = 3
params.icon = "github"

[[module.imports]]
path = "github.com/imfing/hextra"

[pagination]
pagerSize = 10

[params]
description             = "Clean ABAP in a human-friendly format"
displayUpdatedDate      = true
dateFormat              = "2006-01-02"
footer.displayPoweredBy = false

[params.author]
name = "Tobias Buckdahn"

[params.navbar]
displayTitle = true
displayLogo  = false

[taxonomies]
tag      = "tags"
category = "categories"
